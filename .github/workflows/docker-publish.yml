name: Build y publicar imagenes en Docker Hub

# Corre en GitHub (no en tu PC): compila los 10 Dockerfile del backend y los
# sube a Docker Hub como maxmegafuego/cine-<servicio>:latest. Se dispara solo
# con cada push a main, o a mano desde la pestaña "Actions" del repo
# (workflow_dispatch) si queres forzar un rebuild sin tocar codigo.
#
# Requiere 2 secrets en este repo (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   DOCKERHUB_USERNAME = maxmegafuego
#   DOCKERHUB_TOKEN    = un Access Token de Docker Hub (Account Settings ->
#                        Security -> New Access Token) -- NUNCA tu contraseña.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - path: registry
            image: cine-registry
          - path: configServer
            image: cine-configserver
          - path: AdminServer
            image: cine-adminserver
          - path: Auth
            image: cine-auth
          - path: Productos
            image: cine-productos
          - path: Salas
            image: cine-salas
          - path: Ventas
            image: cine-ventas
          - path: Gmail
            image: cine-gmail
          - path: Factura
            image: cine-factura
          - path: Gateway
            image: cine-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.path }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
