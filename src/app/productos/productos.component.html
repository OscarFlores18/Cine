<div class="container">
  <h1 class="page-title">🍿 Productos & Dulcería</h1>
  <p class="page-subtitle">Selecciona tus combos preferidos para disfrutar de la función</p>

  <div class="products-grid">
    <div class="card" *ngFor="let prod of productos">
      <div class="card-image-wrapper">
        <span class="category-badge" *ngIf="prod.categoria">{{ prod.categoria }}</span>
        <img [src]="prod.imagenUrl" [alt]="prod.nombre" class="card-image">
      </div>
      
      <div class="card-content">
        <h2 class="product-name">{{ prod.nombre }}</h2>
        <p class="product-description">{{ prod.descripcion }}</p>
        
        <div class="card-footer">
          <span class="product-price">${{ prod.precio.toFixed(2) }}</span>
          <button class="btn-accent" (click)="agregar(prod)">
            <span>Agregar</span> 🛒
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
